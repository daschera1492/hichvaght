name: Ghost Bridge Operational
on:
  workflow_dispatch: # اجرای دستی برای پایداری بیشتر

jobs:
  establish-bridge:
    runs-on: ubuntu-latest
    steps:
      - name: Environment Preparation
        run: |
          sudo apt-get update && sudo apt-get install -y curl jq tar
          
          # دانلود دقیق نسخه GNU برای رانرهای x86_64 [1]
          curl -L "https://github.com/rathole-org/rathole/releases/download/dev-latest/rathole-dev-x86_64-unknown-linux-gnu.tar.gz" -o rathole_archive.tar.gz
          
          # استخراج در یک پوشه موقت برای جلوگیری از تداخل نام‌ها [2]
          mkdir -p temp_rathole
          tar -xzf rathole_archive.tar.gz -C temp_rathole
          
          # پیدا کردن فایل اجرایی واقعی و انتقال آن به روت
          # فایل اجرایی معمولاً فاقد پسوند یا با نام rathole است
          find temp_rathole -type f -executable -exec mv {} ./rathole \;
          
          chmod +x rathole
          # تست کوتاه برای اطمینان از سالم بودن فایل قبل از اجرای اصلی
          ./rathole --version || echo "File is still not executable"

      - name: Network Signaling (Post Dynamic IP)
        env:
          GH_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
        run: |
          # استخراج آی‌پی عمومی رانر
          RUNNER_IP=$(curl -s https://ifconfig.me)
          echo "Runner IP: $RUNNER_IP"
          
          # آپدیت کردن Gist با آی‌پی جدید جهت اطلاع کلاینت در ایران [1]
          curl -X PATCH -H "Authorization: token $GH_TOKEN" \
               -H "Content-Type: application/json" \
               -d "{\"files\": {\"connection.txt\": {\"content\": \"$RUNNER_IP\"}}}" \
               https://api.github.com/gists/$GIST_ID

      - name: Start Reverse Tunnel
        run: |
          # ساخت فایل کانفیگ کلاینت rathole با توکن اجباری [252، 253]
          cat <<EOF > client.toml
          [client]
          remote_addr = "${{ secrets.VPS_IP }}:2333" # پورت rathole در سرور شما
          
          [client.services.vless]
          type = "tcp"
          token = "${{ secrets.RATHOLE_TOKEN }}" # توکن امنیتی ست شد
          bind_addr = "0.0.0.0:443" # رانر روی پورت 443 گوش می‌دهد [1]
          local_addr = "127.0.0.1:443" # هدایت ترافیک به داخل تونل
          EOF
          
          # اجرای کلاینت
          ./rathole -c client.toml &
          
          echo "Bridge is active with token security. Use the IP in Gist to connect."
          sleep 21000 
