name: Xray Direct No-Install
on: workflow_dispatch

jobs:
  run-proxy:
    runs-on: ubuntu-latest
    steps:
      - name: Download and Run Xray (Manual Mode)
        run: |
          # دانلود مستقیم باینری بدون نیاز به اسکریپت نصب
          wget https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          unzip Xray-linux-64.zip
          chmod +x xray

          # ساخت کانفیگ
          cat <<EOF > config.json
          {
            "inbounds": [{
              "port": 6969,
              "protocol": "vless",
              "settings": {
                "clients": [{ "id": "e08044f5-0645-42bb-b18b-e64bcd3e1575" }],
                "decryption": "none"
              },
              "streamSettings": {
                "network": "xhttp",
                "xhttpSettings": { "path": "/api", "mode": "auto" }
              }
            }],
            "outbounds": [{ "protocol": "freedom" }]
          }
          EOF

          # اجرا در پس‌زمینه
          ./xray -c config.json &

      - name: Run Cloudflare Tunnel
        run: |
          curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared
          ./cloudflared tunnel --url http://127.0.0.1:6969
