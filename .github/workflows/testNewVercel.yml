name: Xray External Proxy Bridge
on: workflow_dispatch

jobs:
  run-proxy:
    runs-on: ubuntu-latest
    steps:
      - name: Install Xray (With Sudo)
        run: |
          # دانلود اسکریپت و اجرای مستقیم با sudo
          curl -L https://github.com/XTLS/Xray-install/raw/main/install-release.sh -o install-release.sh
          chmod +x install-release.sh
          sudo ./install-release.sh

      - name: Configure Xray (Match Image Settings)
        run: |
          # ساخت فایل کانفیگ با استفاده از sudo tee برای اطمینان از دسترسی نوشتن
          echo '{
            "log": { "loglevel": "warning" },
            "inbounds": [{
              "port": 6969,
              "protocol": "vless",
              "settings": {
                "clients": [{ "id": "e08044f5-0645-42bb-b18b-e64bcd3e1575" }],
                "decryption": "none"
              },
              "streamSettings": {
                "network": "xhttp",
                "xhttpSettings": {
                  "path": "/api",
                  "host": "mase.codol.ir",
                  "mode": "auto",
                  "extra": {
                    "externalProxy": [
                      {
                        "dest": "react.dev",
                        "port": 6969
                      }
                    ]
                  }
                }
              }
            }],
            "outbounds": [{ "protocol": "freedom" }]
          }' | sudo tee /usr/local/etc/xray/config.json > /dev/null

      - name: Start Xray Service
        run: |
          # اجرای سرویس ایکس‌ری
          sudo systemctl start xray
          # چک کردن وضعیت برای اطمینان از اجرا
          sudo systemctl status xray | grep "active (running)"

      - name: Run Cloudflare Tunnel
        run: |
          curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared
          echo "--- TARGET FOR VERCEL ---"
          ./cloudflared tunnel --url http://localhost:6969
