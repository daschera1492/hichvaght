name: Xray Final Debug
on: workflow_dispatch

jobs:
  run-proxy:
    runs-on: ubuntu-latest
    steps:
      - name: Install Xray
        run: |
          bash <(curl -L https://github.com/XTLS/Xray-install/raw/main/install-release.sh)
          
      - name: Run Xray with Direct Config
        run: |
          # ساخت کانفیگ در یک فایل ساده
          cat <<EOF > config.json
          {
            "log": { "loglevel": "debug" },
            "inbounds": [{
              "port": 6969,
              "protocol": "vless",
              "settings": {
                "clients": [{ "id": "e08044f5-0645-42bb-b18b-e64bcd3e1575" }],
                "decryption": "none"
              },
              "streamSettings": {
                "network": "xhttp",
                "xhttpSettings": { "path": "/api", "mode": "auto" }
              }
            }],
            "outbounds": [{ "protocol": "freedom" }]
          }
          EOF
          
          # اجرای Xray در پس‌زمینه و هدایت لاگ‌ها به فایل
          sudo nohup xray -c config.json > xray.log 2>&1 &
          sleep 3
          echo "--- XRAY LOG START ---"
          cat xray.log
          echo "--- XRAY LOG END ---"

      - name: Run Cloudflare Tunnel
        run: |
          curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared
          # اجرای تونل و نمایش لاگ‌ها به صورت زنده
          ./cloudflared tunnel --url http://127.0.0.1:6969
