name: GitHub Runner Proxy Hub
on: workflow_dispatch

jobs:
  run-proxy:
    runs-on: ubuntu-latest
    steps:
      - name: Install X-UI (Sanaei)
        run: |
          # نصب با دسترسی sudo و تنظیمات خودکار
          curl -Ls https://raw.githubusercontent.com/mhsanaei/3x-ui/master/install.sh | sudo bash <<EOF
          y
          admin
          admin
          2053
          EOF

      - name: Install & Run Cloudflare Tunnels
        run: |
          # دانلود کلودفلرد
          curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared

          # اجرای تونل اول برای پنل (Port 2053)
          echo "--- STARTING PANEL TUNNEL ---"
          nohup ./cloudflared tunnel --url http://localhost:2053 > panel_link.log 2>&1 &
          
          # صبر برای ایجاد لینک و استخراج آن
          sleep 10
          echo "Your Panel URL is:"
          grep -o 'https://[-a-z0-9.]*trycloudflare.com' panel_link.log | head -n 1

          # اجرای تونل دوم برای ورسل (Port 6969)
          echo "--- STARTING VERCEL RELAY TUNNEL ---"
          ./cloudflared tunnel --url http://localhost:6969
