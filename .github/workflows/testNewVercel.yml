name: Xray External Proxy Bridge
on: workflow_dispatch

jobs:
  run-proxy:
    runs-on: ubuntu-latest
    steps:
      - name: Install Xray
        run: bash <(curl -L https://github.com/XTLS/Xray-install/raw/main/install-release.sh)
          
      - name: Configure Xray (Match Image Settings)
        run: |
          sudo echo '{
            "log": { "loglevel": "warning" },
            "inbounds": [{
              "port": 6969,
              "protocol": "vless",
              "settings": {
                "clients": [{ "id": "e08044f5-0645-42bb-b18b-e64bcd3e1575" }],
                "decryption": "none"
              },
              "streamSettings": {
                "network": "xhttp",
                "xhttpSettings": {
                  "path": "/api",
                  "host": "mase.codol.ir",
                  "mode": "auto",
                  "extra": {
                    "externalProxy": [
                      {
                        "dest": "react.dev",
                        "port": 6969
                      }
                    ]
                  }
                }
              }
            }],
            "outbounds": [{ "protocol": "freedom" }]
          }' > /tmp/config.json
          
          sudo nohup xray -c /tmp/config.json &

      - name: Run Cloudflare Tunnel
        run: |
          curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared
          echo "--- TARGET FOR VERCEL ---"
          ./cloudflared tunnel --url http://localhost:6969
