name: Xray Root Stealth Mode
on: workflow_dispatch

jobs:
  run-proxy:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Xray Core
        run: |
          # دانلود مستقیم باینری برای حذف محدودیت روت در نصب
          wget https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          unzip Xray-linux-64.zip
          chmod +x xray
          
          # ساخت کانفیگ با رعایت فریب react.dev
          cat <<EOF > config.json
          {
            "log": { "loglevel": "warning" },
            "inbounds": [{
              "port": 6969,
              "protocol": "vless",
              "settings": {
                "clients": [{ "id": "e08044f5-0645-42bb-b18b-e64bcd3e1575" }],
                "decryption": "none"
              },
              "streamSettings": {
                "network": "ws",
                "wsSettings": { 
                  "path": "/api",
                  "headers": { "Host": "react.dev" }
                }
              }
            }],
            "outbounds": [
              {
                "protocol": "freedom",
                "tag": "direct"
              },
              {
                "protocol": "socks",
                "tag": "decoy",
                "settings": {
                  "servers": [{ "address": "react.dev", "port": 6969 }]
                }
              }
            ]
          }
          EOF

          # اجرای ایکس‌ری با دسترسی روت
          sudo nohup ./xray -c config.json > xray.log 2>&1 &
          sleep 2
          echo "--- Service Check ---"
          sudo ps aux | grep xray

      - name: Run Cloudflare Tunnel
        run: |
          curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared
          echo "--- COPY THIS LINK TO VERCEL ---"
          sudo ./cloudflared tunnel --url http://127.0.0.1:6969
