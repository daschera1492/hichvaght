name: Ubuntu Tailscale Auto Exit Node

on:
  workflow_dispatch:

  schedule:
    # هر 3 ساعت
    - cron: '0 */3 * * *'

jobs:
  tailscale-exit:
    runs-on: ubuntu-latest

    # حدود 5 ساعت روشن بماند
    timeout-minutes: 298

    steps:

      # -----------------------------------
      # Update System
      # -----------------------------------
      - name: Update system
        run: |
          sudo apt update -y

      # -----------------------------------
      # Install dependencies
      # -----------------------------------
      - name: Install packages
        run: |
          sudo apt install -y \
            curl \
            jq \
            lsb-release \
            iptables

      # -----------------------------------
      # Detect location & create hostname
      # -----------------------------------
      - name: Generate smart hostname
        run: |

          COUNTRY=$(curl -s https://ipinfo.io/country | tr '[:upper:]' '[:lower:]')
          CITY=$(curl -s https://ipinfo.io/city)

          # ساخت پرچم
          if [ "$COUNTRY" = "us" ]; then
            FLAG="🇺🇸"
          elif [ "$COUNTRY" = "de" ]; then
            FLAG="🇩🇪"
          elif [ "$COUNTRY" = "nl" ]; then
            FLAG="🇳🇱"
          elif [ "$COUNTRY" = "gb" ]; then
            FLAG="🇬🇧"
          elif [ "$COUNTRY" = "fr" ]; then
            FLAG="🇫🇷"
          elif [ "$COUNTRY" = "ca" ]; then
            FLAG="🇨🇦"
          elif [ "$COUNTRY" = "jp" ]; then
            FLAG="🇯🇵"
          elif [ "$COUNTRY" = "sg" ]; then
            FLAG="🇸🇬"
          else
            FLAG="🏳️"
          fi

          # تمیز کردن نام شهر
          CITY_CLEAN=$(echo "$CITY" \
            | tr '[:upper:]' '[:lower:]' \
            | sed 's/ /-/g' \
            | sed 's/[^a-z0-9-]//g')

          # ساعت شروع به وقت تهران
          START_TIME=$(TZ=Asia/Tehran date +'%H-%M')

          # ساعت پایان (5 ساعت بعد)
          END_TIME=$(TZ=Asia/Tehran date -d '+5 hour' +'%H-%M')

          # hostname نهایی
          HOSTNAME="${COUNTRY}-${FLAG}-${CITY_CLEAN}-${START_TIME}-${END_TIME}"

          echo "================================="
          echo "Country : $COUNTRY"
          echo "City    : $CITY"
          echo "Hostname: $HOSTNAME"
          echo "================================="

          echo "HOSTNAME=$HOSTNAME" >> $GITHUB_ENV

      # -----------------------------------
      # Add Tailscale GPG key
      # -----------------------------------
      - name: Add Tailscale GPG key
        run: |
          curl -fsSL \
          https://pkgs.tailscale.com/stable/ubuntu/$(lsb_release -cs).noarmor.gpg \
          | sudo tee /usr/share/keyrings/tailscale-archive-keyring.gpg >/dev/null

      # -----------------------------------
      # Add Tailscale repository
      # -----------------------------------
      - name: Add Tailscale repository
        run: |
          curl -fsSL \
          https://pkgs.tailscale.com/stable/ubuntu/$(lsb_release -cs).tailscale-keyring.list \
          | sudo tee /etc/apt/sources.list.d/tailscale.list

      # -----------------------------------
      # Install Tailscale
      # -----------------------------------
      - name: Install Tailscale
        run: |
          sudo apt update
          sudo apt install -y tailscale

      # -----------------------------------
      # Enable IP forwarding
      # -----------------------------------
      - name: Enable IP forwarding
        run: |

          echo 'net.ipv4.ip_forward = 1' \
          | sudo tee /etc/sysctl.d/99-tailscale.conf

          echo 'net.ipv6.conf.all.forwarding = 1' \
          | sudo tee -a /etc/sysctl.d/99-tailscale.conf

          sudo sysctl -p /etc/sysctl.d/99-tailscale.conf

      # -----------------------------------
      # Start tailscaled
      # -----------------------------------
      - name: Start tailscaled
        run: |
          sudo systemctl enable --now tailscaled

      # -----------------------------------
      # Connect to Tailscale
      # -----------------------------------
      - name: Connect to Tailscale
        run: |

          sudo tailscale up \
            --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} \
            --advertise-exit-node \
            --advertise-tags=tag:exit-node \
            --hostname="$HOSTNAME"

      # -----------------------------------
      # Configure NAT
      # -----------------------------------
      - name: Configure NAT
        run: |

          DEFAULT_IF=$(ip route | grep default | awk '{print $5}' | head -n1)

          echo "Default Interface: $DEFAULT_IF"

          sudo iptables -A FORWARD -i tailscale0 -o $DEFAULT_IF -j ACCEPT

          sudo iptables -A FORWARD \
            -i $DEFAULT_IF \
            -o tailscale0 \
            -m state --state RELATED,ESTABLISHED \
            -j ACCEPT

          sudo iptables -t nat -A POSTROUTING -o $DEFAULT_IF -j MASQUERADE

      # -----------------------------------
      # Show status
      # -----------------------------------
      - name: Tailscale status
        run: |
          tailscale status

      # -----------------------------------
      # Keep runner alive
      # -----------------------------------
      - name: Keep runner alive
        run: |

          echo "======================================"
          echo "Exit Node ACTIVE"
          echo "Hostname: $HOSTNAME"
          echo "Running for 5 hours..."
          echo "======================================"

          sleep 18000
