
name: Android Phone Emulator

on:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 298

    steps:
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || echo "KVM NOT AVAILABLE"
          nproc
          free -h

      - name: Install packages
        run: |
          sudo apt-get update -y
          sudo apt-get install -y curl jq lsb-release socat

      - name: Add Tailscale GPG key
        run: |
          curl -fsSL "https://pkgs.tailscale.com/stable/ubuntu/$(lsb_release -cs).noarmor.gpg" \
            | sudo tee /usr/share/keyrings/tailscale-archive-keyring.gpg >/dev/null

      - name: Add Tailscale repository
        run: |
          curl -fsSL "https://pkgs.tailscale.com/stable/ubuntu/$(lsb_release -cs).tailscale-keyring.list" \
            | sudo tee /etc/apt/sources.list.d/tailscale.list

      - name: Install Tailscale
        run: |
          sudo apt-get update -y
          sudo apt-get install -y tailscale

      - name: Start tailscaled
        run: |
          sudo systemctl enable --now tailscaled

      - name: Connect to Tailscale
        run: |
          sudo tailscale up \
            --authkey="${{ secrets.TAILSCALE_AUTH_KEY }}" \
            --hostname="gh-android-${{ github.run_id }}" \
            --accept-routes

          echo "TS_IP=$(tailscale ip -4)" >> "$GITHUB_ENV"
          tailscale status

      - name: Run Android phone emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          ram-size: 4096M
          heap-size: 512M
          disk-size: 16G
          cores: 2
          disable-animations: true
          force-avd-creation: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -noaudio -no-metrics -camera-back none -camera-front none
          script: |
            set -eu

            echo "Checking Android emulator..."
            adb devices
            adb shell getprop ro.product.model
            adb shell getprop ro.build.characteristics
            adb shell wm size
            adb shell wm density

            echo "Starting ADB TCP relay..."
            nohup socat TCP-LISTEN:5037,fork,reuseaddr,bind="${TS_IP}" TCP:127.0.0.1:5037 > socat-adb.log 2>&1 &

            echo "Starting scrcpy TCP relay..."
            nohup socat TCP-LISTEN:27183,fork,reuseaddr,bind="${TS_IP}" TCP:127.0.0.1:27183 > socat-scrcpy.log 2>&1 &

            sleep 3

            echo "======================================"
            echo "ANDROID PHONE READY"
            echo "Tailscale IP : ${TS_IP}"
            echo "ADB server   : ${TS_IP}:5037"
            echo "scrcpy port  : ${TS_IP}:27183"
            echo "======================================"

            while true
            do
              sleep 20

              if ! adb devices >/dev/null 2>&1; then
                echo "ADB check failed; retrying..."
              fi

              CURRENT_TIME=$(date +%s)
              if [ $((CURRENT_TIME % 300)) -lt 20 ]; then
                echo "alive $(date -u +%H:%M:%S)"
              fi
            done
