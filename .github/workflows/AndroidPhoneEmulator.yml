
name: Android Phone Emulator

on:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 298

    steps:
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || echo "KVM NOT AVAILABLE"
          nproc
          free -h

      - name: Install packages
        run: |
          sudo apt-get update -y
          sudo apt-get install -y curl jq lsb-release socat

      - name: Add Tailscale GPG key
        run: |
          curl -fsSL "https://pkgs.tailscale.com/stable/ubuntu/$(lsb_release -cs).noarmor.gpg" \
            | sudo tee /usr/share/keyrings/tailscale-archive-keyring.gpg >/dev/null

      - name: Add Tailscale repository
        run: |
          curl -fsSL "https://pkgs.tailscale.com/stable/ubuntu/$(lsb_release -cs).tailscale-keyring.list" \
            | sudo tee /etc/apt/sources.list.d/tailscale.list

      - name: Install Tailscale
        run: |
          sudo apt-get update -y
          sudo apt-get install -y tailscale

      - name: Start Tailscale
        run: |
          sudo systemctl enable --now tailscaled

      - name: Connect to Tailscale
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          if [ -z "$TAILSCALE_AUTH_KEY" ]; then
            echo "ERROR: TAILSCALE_AUTH_KEY secret is missing."
            exit 1
          fi

          sudo tailscale up \
            --authkey="$TAILSCALE_AUTH_KEY" \
            --hostname="gh-android-${GITHUB_RUN_ID}" \
            --accept-routes

          TS_IP="$(tailscale ip -4 | head -n 1)"

          if [ -z "$TS_IP" ]; then
            echo "ERROR: Could not obtain Tailscale IPv4 address."
            exit 1
          fi

          echo "TS_IP=$TS_IP" >> "$GITHUB_ENV"
          echo "Tailscale IP: $TS_IP"
          tailscale status

      # Create the script BEFORE the emulator action.
      # This avoids android-emulator-runner's multiline parser.
      - name: Prepare emulator script
        run: |
          cat > /tmp/android-emulator-script.sh <<'EMULATOR_SCRIPT'
          #!/usr/bin/env bash
          set -eu

          echo "Checking Android emulator..."
          adb devices
          adb shell getprop ro.product.model
          adb shell getprop ro.build.characteristics
          adb shell wm size
          adb shell wm density

          echo "Starting ADB relay..."
          nohup socat \
            TCP-LISTEN:5037,fork,reuseaddr,bind="${TS_IP}" \
            TCP:127.0.0.1:5037 \
            > /tmp/socat-adb.log 2>&1 &

          echo "Starting scrcpy port relay..."
          nohup socat \
            TCP-LISTEN:27183,fork,reuseaddr,bind="${TS_IP}" \
            TCP:127.0.0.1:27183 \
            > /tmp/socat-scrcpy.log 2>&1 &

          sleep 3

          echo "======================================"
          echo "ANDROID PHONE READY"
          echo "Tailscale IP : ${TS_IP}"
          echo "ADB server   : ${TS_IP}:5037"
          echo "scrcpy port  : ${TS_IP}:27183"
          echo "======================================"

          # Keep the action running without multiline shell parsing.
          while true; do
            sleep 20
            adb devices >/dev/null 2>&1 || true

            CURRENT_TIME="$(date +%s)"
            if [ "$((CURRENT_TIME % 300))" -lt 20 ]; then
              echo "alive $(date -u +%H:%M:%S)"
            fi
          done
          EMULATOR_SCRIPT

          chmod +x /tmp/android-emulator-script.sh
          bash -n /tmp/android-emulator-script.sh
          echo "Emulator script syntax check passed."

      - name: Run Android phone emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          ram-size: 4096M
          heap-size: 512M
          disk-size: 16G
          cores: 2
          disable-animations: true
          force-avd-creation: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -noaudio -no-metrics -camera-back none -camera-front none
          script: bash /tmp/android-emulator-script.sh
