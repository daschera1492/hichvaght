name: Android VM v2

on:
  workflow_dispatch:

# ---------------------------------------------------------------------------
# Tunables. Everything worth changing lives here so you never touch the steps.
# ---------------------------------------------------------------------------
env:
  # --- guest sizing -------------------------------------------------------
  # Standard ubuntu-latest runner = 4 vCPU. 4 vCPUs + MTTCG is the sweet spot;
  # going higher just adds TCG lock contention.
  GUEST_MEM: 4096
  GUEST_SMP: 4

  # --- TCG acceleration ---------------------------------------------------
  # thread=multi is THE single biggest win: without it QEMU emulates the whole
  # guest on one host core no matter what -smp says. tb-size=1024 gives the
  # translator a bigger code cache (default 32MB thrashes on Android).
  TCG_OPTS: "thread=multi,tb-size=1024"

  # --- CPU model ----------------------------------------------------------
  # qemu64 (the default) lacks SSE4.2/POPCNT, so bionic + ART fall back to slow
  # paths. Nehalem adds SSE4.2 without AVX. AVX/AVX2 under TCG go through slow
  # helper functions, so we deliberately stop before them.
  # If a build misbehaves, try:   -cpu max
  GUEST_CPU: "Nehalem"

  # --- display ------------------------------------------------------------
  # VNC display :1  ->  TCP 5901, bound to loopback, exposed only inside the
  # tailnet via `tailscale serve` / socat.
  #
  # NO VNC PASSWORD, deliberately. Rationale:
  #   - the port is only ever reachable from inside your tailnet, and the
  #     tailnet ACL is the real access boundary, not the VNC password
  #   - RFB (the VNC protocol) caps passwords at 8 characters, so anything
  #     longer is silently truncated server-side -> "authentication failed"
  #   - QEMU has no command-line flag for it; it must be set through the
  #     monitor socket after boot, which is one more silent failure point
  # Net effect: the password added breakage without adding a real boundary.
  VNC_DISPLAY: "1"
  VNC_PORT: "5901"

  # --- ISO identity -------------------------------------------------------
  ISO_URL: "https://downloads.sourceforge.net/project/android-x86/Release%209.0/android-x86_64-9.0-r2.iso"
  ISO_SIZE: "965738496"
  # Leave empty to skip hash verification. To enable: download the ISO once
  # yourself, run `shasum -a 256 android-x86_64-9.0-r2.iso`, and paste it here.
  # Do NOT trust a hash from a blog post -- verify it yourself.
  ISO_SHA256: ""

jobs:
  android-vm:
    # Pinned on purpose: ubuntu-latest will roll to 26.04 and break
    # `lsb_release -cs`-based Tailscale repo setup.
    runs-on: ubuntu-24.04
    timeout-minutes: 298

    steps:
      # ------------------------------------------------------------------
      - name: Show hardware
        run: |
          nproc
          free -h
          df -h /
          lscpu | grep -iE "model name|vmx|svm" || echo "(no virt flags)"

      # ------------------------------------------------------------------
      # GitHub-hosted runners never expose /dev/kvm. This is only here to
      # prove it in the log so nobody wastes time hunting for a flag that
      # would enable it. There isn't one.
      - name: Check /dev/kvm
        run: |
          if [ -e /dev/kvm ]; then
            echo "KVM=YES" >> "$GITHUB_ENV"
            ls -l /dev/kvm
          else
            echo "KVM=NO" >> "$GITHUB_ENV"
            echo "/dev/kvm absent -> Android boots under TCG (software emulation)."
            echo "No QEMU flag can change this on a GitHub-hosted runner."
          fi

      # ------------------------------------------------------------------
      - name: Install packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y curl jq socat lsb-release qemu-system-x86 qemu-utils

      # ------------------------------------------------------------------
      # Tailscale
      # ------------------------------------------------------------------
      - name: Add Tailscale GPG key
        run: |
          curl -fsSL "https://pkgs.tailscale.com/stable/ubuntu/$(lsb_release -cs).noarmor.gpg" \
            | sudo tee /usr/share/keyrings/tailscale-archive-keyring.gpg >/dev/null

      - name: Add Tailscale repository
        run: |
          curl -fsSL "https://pkgs.tailscale.com/stable/ubuntu/$(lsb_release -cs).tailscale-keyring.list" \
            | sudo tee /etc/apt/sources.list.d/tailscale.list

      - name: Install Tailscale
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y tailscale

      - name: Start tailscaled
        run: |
          sudo systemctl enable --now tailscaled

      # --accept-dns=false   : the tailnet resolver must not interfere with
      #                        the ISO download.
      # --accept-routes      : DROPPED. It has no use here and only risks
      #                        routing runner traffic through your subnets.
      # TS_AUTHKEY via env  : keeps the key out of `ps` output for every
      #                        other process on the runner.
      - name: Connect to Tailscale
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${TS_AUTHKEY:-}" ]; then
            echo "::error::secret TAILSCALE_AUTH_KEY is empty -- add it in repo Settings > Secrets"
            exit 1
          fi

          # Hand the key over as a 0600 file rather than argv. `tailscale up
          # --authkey=...` exposes it in `ps` to every process on the runner,
          # and sudo would strip an env var unless SETENV happens to be allowed.
          KEYFILE="$(mktemp)"
          chmod 600 "$KEYFILE"
          printf '%s' "$TS_AUTHKEY" > "$KEYFILE"
          echo "KEYFILE=$KEYFILE" >> "$GITHUB_ENV"

          sudo tailscale up \
            --auth-key="file:$KEYFILE" \
            --hostname="gh-android-${{ github.run_id }}" \
            --accept-dns=false

          rm -f "$KEYFILE"

          TS_IP="$(tailscale ip -4)"
          TS_NAME="$(tailscale status --json | jq -r '.Self.DNSName' | sed 's/\.$//')"
          echo "TS_IP=$TS_IP"     >> "$GITHUB_ENV"
          echo "TS_NAME=$TS_NAME" >> "$GITHUB_ENV"

          echo "--- tailscale status ---"
          tailscale status

          # relay vs direct decides more of your latency than any QEMU flag.
          if tailscale status | grep -qiE 'relay|derp'; then
            echo "::warning::connection is going through a DERP relay -- expect high latency"
          fi

      # ------------------------------------------------------------------
      # ISO cache
      # ------------------------------------------------------------------
      # restore/save are separate actions on purpose. The plain actions/cache
      # writes in a POST step, and this job is killed by timeout-minutes long
      # before any post step runs -- so the cache was never actually saved.
      # Saving explicitly right after the download fixes that.
      - name: Restore ISO from cache
        id: cache-iso
        uses: actions/cache/restore@v4
        with:
          path: android.iso
          key: android-x86-9.0-r2-${{ runner.os }}-v2

      - name: Download Android-x86 ISO
        if: steps.cache-iso.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          for i in $(seq 1 8); do
            echo "=== download attempt $i ==="
            # -C -  resume from where it stopped (the important bit)
            # -L    follow the SourceForge redirect
            if curl -fL -C - --retry 3 --retry-delay 5 --connect-timeout 20 \
                 --progress-bar -o android.iso "$ISO_URL"; then
              echo "DOWNLOAD_OK attempt=$i"
              break
            fi
            echo "attempt $i interrupted -> keeping partial file, resuming"
            sleep 5
          done

          ACTUAL="$(stat -c%s android.iso)"
          echo "size=$ACTUAL expected=$ISO_SIZE"
          if [ "$ACTUAL" != "$ISO_SIZE" ]; then
            echo "::error::size mismatch -- partial or corrupt download"
            exit 1
          fi

          if [ -n "$ISO_SHA256" ]; then
            echo "$ISO_SHA256  android.iso" | sha256sum -c -
          else
            echo "NOTE: ISO_SHA256 is empty, size check only. See the env block."
          fi

          ls -lh android.iso
          file android.iso

      - name: Save ISO to cache
        if: steps.cache-iso.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: android.iso
          key: android-x86-9.0-r2-${{ runner.os }}-v2

      # ------------------------------------------------------------------
      # Boot
      # ------------------------------------------------------------------
      - name: Boot Android VM
        run: |
          set -euo pipefail
          qemu-img create -f qcow2 android-disk.qcow2 16G

          # No -enable-kvm branch: KVM is never present here, and pretending
          # otherwise just hides which code path actually ran.
          nohup sudo qemu-system-x86_64 \
            -m "$GUEST_MEM" -smp "$GUEST_SMP" \
            -accel "tcg,$TCG_OPTS" \
            -cpu "$GUEST_CPU" \
            -cdrom android.iso \
            -drive file=android-disk.qcow2,format=qcow2,if=virtio \
            -boot d \
            -usb -device usb-tablet \
            -vga std \
            -display "vnc=127.0.0.1:${VNC_DISPLAY}" \
            -monitor "unix:/tmp/qemu-mon.sock,server,nowait" \
            -netdev user,id=n0 -device virtio-net-pci,netdev=n0 \
            > qemu.log 2>&1 &

          echo "QEMU_PID=$!" >> "$GITHUB_ENV"
          sleep 25
          echo "--- qemu.log ---"
          tail -30 qemu.log
          ss -tlnp 2>/dev/null | grep "$VNC_PORT" || echo "VNC not listening yet (still booting)"

      # ------------------------------------------------------------------
      # QEMU binds VNC to 127.0.0.1 on purpose (so it is never reachable from
      # the public internet), which means the tailnet IP alone is not enough --
      # something has to forward tailnet:5901 -> 127.0.0.1:5901.
      #
      # `tailscale serve` needs the feature to be permitted for the tailnet, so
      # a silent failure there would leave you with a published address that
      # nothing answers on. Hence the socat fallback plus a real reachability
      # check on the tailnet interface.
      - name: Expose VNC over Tailscale
        run: |
          set -euo pipefail

          if sudo tailscale serve --bg --tcp "$VNC_PORT" "tcp://127.0.0.1:$VNC_PORT" 2>/dev/null \
             && sudo tailscale serve status 2>/dev/null | grep -q "$VNC_PORT"; then
            echo "METHOD=tailscale-serve" >> "$GITHUB_ENV"
            echo "tailscale serve is forwarding the port"
            sudo tailscale serve status || true
          else
            echo "tailscale serve unavailable -> falling back to socat"
            echo "METHOD=socat" >> "$GITHUB_ENV"
            nohup sudo socat \
              "TCP-LISTEN:${VNC_PORT},bind=${TS_IP},fork,reuseaddr" \
              "TCP:127.0.0.1:${VNC_PORT}" > socat.log 2>&1 &
            sleep 3
            tail -5 socat.log || true
          fi

          echo "--- listeners on ${VNC_PORT} ---"
          ss -tlnp 2>/dev/null | grep "$VNC_PORT" || true

          # Prove the path end-to-end from the tailnet address, not loopback.
          if timeout 5 bash -c "exec 3<>/dev/tcp/${TS_IP}/${VNC_PORT}" 2>/dev/null; then
            echo "OK: ${TS_IP}:${VNC_PORT} is reachable"
          else
            echo "::error::${TS_IP}:${VNC_PORT} is NOT reachable -- VNC would fail for you"
            exit 1
          fi

      # ------------------------------------------------------------------
      - name: Publish connection details
        run: |
          {
            echo "## Android VM is up"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| **Tailscale IP** | \`${TS_IP}:${VNC_PORT}\` |"
            echo "| **MagicDNS** | \`${TS_NAME}:${VNC_PORT}\` |"
            echo "| Acceleration | TCG (\`$TCG_OPTS\`), cpu=\`$GUEST_CPU\` |"
            echo
            echo "Connect any VNC client to either address above. No password."
            echo "For usable speed: set color depth to 8-bit and encoding to Tight."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::notice::VNC ready at ${TS_IP}:${VNC_PORT} (no password)"

      # ------------------------------------------------------------------
      - name: Keep alive
        run: |
          echo "=============================================="
          echo "  ANDROID VM READY"
          echo ""
          echo "  Tailscale IP : ${TS_IP}:${VNC_PORT}"
          echo "  MagicDNS     : ${TS_NAME}:${VNC_PORT}"
          echo "  Password     : (none)"
          echo ""
          echo "  Connect with any VNC client."
          echo "=============================================="

          while true; do
            sleep 300
            ts="$(tailscale ip -4 2>/dev/null || echo -)"
            q="$(pgrep -c qemu-system || echo 0)"
            echo "[$(date -u +%H:%M:%S)] alive | ${ts}:${VNC_PORT} | qemu=${q}"
            echo "   (tip: 8-bit color + Tight encoding for usable speed)"
          done
