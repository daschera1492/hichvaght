name: 9Router Stop

# Archives the router state (official 9router export + SQLite database + secrets)
# as an encrypted GitHub release asset, then destroys the VM and its route,
# releasing the free-tier quota. The hostname and its DNS records stay in place,
# so the next Start brings the same URL back.
on:
  workflow_dispatch:
    inputs:
      force_backup:
        description: "Archive even when the router is empty (overwrites the last good archive)"
        type: boolean
        default: false

concurrency:
  group: 9router-lifecycle
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  stop:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      FREESTYLE_API_KEY: ${{ secrets.FREESTYLE_API_KEY }}
      ROUTER_DOMAIN: router.codol.ir
      ROUTER_SLUG: nine-router
      ROUTER_PORT: "20128"
      GITHUB_TOKEN: ${{ github.token }}
      BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
      FORCE_BACKUP: ${{ inputs.force_backup && '1' || '0' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: scripts/freestyle-router
        run: npm install --no-audit --no-fund

      - name: Stop 9Router
        working-directory: scripts/freestyle-router
        run: node stop.mjs
