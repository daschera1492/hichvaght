name: CF dns (temporary)

# Throwaway: creates the CNAME the dashboard's "Public Hostname" step would have
# created, then reports what the public URL answers so the cause is unambiguous:
#   1033 -> the connector is not connected
#   404  -> connected, but the tunnel has no ingress rule for this hostname
#   200  -> working
on:
  workflow_dispatch:

jobs:
  dns:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
      CF_TUNNEL_TOKEN: ${{ secrets.CF_TUNNEL_TOKEN }}

    steps:
      - name: Create the CNAME and probe
        run: |
          node --input-type=module -e '
          const tok = process.env.CF_API_TOKEN;
          const zone = process.env.CF_ZONE_ID;
          const payload = JSON.parse(Buffer.from(process.env.CF_TUNNEL_TOKEN, "base64").toString());
          const tunnelId = payload.t;
          const target = `${tunnelId}.cfargotunnel.com`;
          console.log(`account ${payload.a}`);
          console.log(`tunnel  ${tunnelId}`);
          console.log(`target  ${target}`);

          const call = async (method, path, body) => {
            const res = await fetch(`https://api.cloudflare.com/client/v4${path}`, {
              method,
              headers: { Authorization: `Bearer ${tok}`, "Content-Type": "application/json" },
              body: body ? JSON.stringify(body) : undefined,
            });
            return { status: res.status, json: await res.json().catch(() => ({})) };
          };

          const existing = await call("GET", `/zones/${zone}/dns_records?name=router2.codol.ir`);
          console.log(`existing records: ${existing.json?.result?.length ?? "?"}`);

          const body = { type: "CNAME", name: "router2.codol.ir", content: target, proxied: true, ttl: 1 };
          let res;
          if (existing.json?.result?.length) {
            const id = existing.json.result[0].id;
            res = await call("PUT", `/zones/${zone}/dns_records/${id}`, body);
            console.log(`update -> http=${res.status} success=${res.json.success}`);
          } else {
            res = await call("POST", `/zones/${zone}/dns_records`, body);
            console.log(`create -> http=${res.status} success=${res.json.success}`);
          }
          if (!res.json?.success) console.log(JSON.stringify(res.json.errors));

          console.log("waiting for the record to resolve…");
          for (let i = 1; i <= 20; i++) {
            await new Promise((r) => setTimeout(r, 6000));
            const dns = await fetch("https://cloudflare-dns.com/dns-query?name=router2.codol.ir&type=A",
              { headers: { accept: "application/dns-json" } }).then((r) => r.json());
            if (dns.Status === 0 && dns.Answer?.length) {
              console.log(`resolves after ${i * 6}s: ${dns.Answer.map((a) => a.data).join(",")}`);
              break;
            }
            if (i === 20) console.log("still not resolving");
          }

          for (const path of ["/api/health", "/dashboard"]) {
            const res = await fetch(`https://router2.codol.ir${path}`, {
              headers: { "user-agent": "Mozilla/5.0" },
              redirect: "manual",
            }).catch((e) => ({ status: 0, text: async () => e.message }));
            const text = (await res.text().catch(() => "")).replace(/\s+/g, " ").slice(0, 220);
            console.log(`GET ${path} -> ${res.status} | ${text}`);
          }
          '
