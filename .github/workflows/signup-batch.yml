name: ساخت حساب  —  Signup batch

# اجرای کاملاً خودکارِ اتوماسیون ثبت‌نام گوگل (GmailDuck) روی رانر عمومی ویندوز
# گیت‌هاب — بدون هیچ دخالت دستی: claim از هاب ← ثبت‌نام ← کد از صندوق هاب ←
# گزارش registered/released ← پایان و بستن خودکار job.
#
# ورودی‌ها در لحظهٔ Start workflow (Run workflow) تعیین می‌شوند:
#   1. count         تعداد حساب برای ساخت
#   2. email_method  duck | generated | erine یا rotate (= تلفیقیِ هر سه)
#   3. auto          full = کاملاً اتوماتیک (پیش‌فرض)
#   4. proxy         رشتهٔ پروکسی host:port:user:pass (خالی = از Secret)
#   5. proxy_country کشور خروج پروکسی (پیش‌فرض us)
#
# ── چرا پروکسی به‌تنهایی بی‌فایده بود ──────────────────────────────────────────
# یک IP مسکونی وقتی «کامپیوتر» هنوز en-US و America/Los_Angeles است، خودش
# تناقض است: گوگل کشور IP را با زبان مرورگر و منطقهٔ زمانی دستگاه مقایسه
# می‌کند و تناقض = همان امتیاز ریسکی که آخرِ ثبت‌نام `?error=BAD_REQUEST`
# می‌دهد. پس ترتیب اجرا این است و هر مرحله سخت‌گیرانه است:
#
#   ① پروکسی الزامی است — بدون آن اجرا اصلاً شروع نمی‌شود.
#   ② زبان کروم دقیقاً روی کشور پروکسی ست می‌شود (و زبان ویندوز هم تا جای
#      ممکن؛ اگر رانر بستهٔ زبان را نداشته باشد، فقط هشدار می‌دهد چون معیار
#      واقعیِ گوگل زبانِ مرورگر است).
#   ③ منطقهٔ زمانی کروم دقیقاً روی همان کشور ست می‌شود (و ویندوز هم همین‌طور).
#   ④ سپس IP واقعیِ خروجی از دو سرویس مستقل پرسیده می‌شود؛ اگر کشورش با
#      کشور مورد انتظار یکی نبود، کار همان‌جا با شکست تمام می‌شود.
#
# Secret های لازم (Settings → Secrets and variables → Actions):
#   HUB_URL         آدرس هاب          (قبلاً هم ثبت شده)
#   HUB_API_KEY     کلید dhk_… هاب     (قبلاً هم ثبت شده)
#   PROXY           رشتهٔ پروکسی پیش‌فرض (host:port:user:pass)
#   GMAILDUCK_PAT   توکن دسترسی به مخزن خصوصی daschera1492/GmailDuck

on:
  workflow_dispatch:
    inputs:
      count:
        description: '۱) تعداد حساب برای ساخت'
        required: true
        default: '1'
      email_method:
        description: '۲) منبع ایمیل — rotate یعنی تلفیقیِ هر سه (duck ← generated ← erine)'
        required: true
        default: 'duck'
        type: choice
        options:
          - duck
          - generated
          - erine
          - rotate
      auto:
        description: '۳) حالت اجرا — full کاملاً اتوماتیک است (تیک و دکمهٔ آخر را هم ماشین می‌زند)'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - manual
      proxy:
        description: '۴) رشتهٔ پروکسی (host:port:user:pass) — خالی یعنی از Secret پروکسی استفاده شود'
        required: false
        default: ''
      proxy_country:
        description: '۵) کشور خروج پروکسی — زبان و منطقهٔ زمانی دستگاه هم روی همین کشور ست می‌شود'
        required: true
        default: 'us'
        type: choice
        options:
          - us
          - ca
          - gb
          - de
          - fr
          - nl
          - es
          - it
          - se
          - pl
          - tr
          - ae
          - au
          - jp
          - kr
          - in
          - br
          - mx

# دو دستهٔ همزمان از یک IP فقط الگوی ریسک می‌سازند — همیشه یکی پشت سر دیگری.
concurrency:
  group: signup-batch
  cancel-in-progress: false

permissions:
  contents: write # ثبت نتیجهٔ هر اجرا در پوشهٔ results/

jobs:
  batch:
    runs-on: windows-latest
    timeout-minutes: 340 # زیر سقف ۶ ساعتهٔ job ها؛ خودِ اسکریپت سقف ۳۰۰ دقیقه دارد.
    defaults:
      run:
        shell: pwsh
        working-directory: GmailDuck

    env:
      HUB_URL: ${{ vars.HUB_URL || secrets.HUB_URL }}
      HUB_KEY: ${{ vars.HUB_KEY || secrets.HUB_API_KEY }}
      # ۱) تعداد
      GSA_COUNT: ${{ inputs.count }}
      # ۲) منبع ایمیل
      GSA_METHOD: ${{ inputs.email_method }}
      # ۳) کاملاً اتوماتیک
      GSA_AUTO_FINISH: ${{ inputs.auto == 'full' && '1' || '0' }}
      # ۴) پروکسی — الزامی. خالی بودن این یعنی `npm` هم شروع نمی‌شود.
      GSA_PROXY: ${{ inputs.proxy != '' && inputs.proxy || secrets.PROXY }}
      GSA_PROXY_COUNTRY: ${{ inputs.proxy_country }}
      GSA_PROXY_STICKY: '1'   # یک IP ثابت برای کل یک ثبت‌نام
      GSA_PROXY_STRICT: '1'    # بدون تعویض بی‌خبر IP در وسط ثبت‌نام
      GSA_PROXY_SESSION_MIN: '60'
      # ① پروکسی اجباری است و ④ اگر کشور IP تأیید نشد، اجرا ادامه پیدا نمی‌کند.
      GSA_REQUIRE_PROXY: '1'
      GSA_GEO_STRICT: '1'
      GSA_GEO_CHECK_EACH: '1'  # پیش از هر ثبت‌نام هم کشور IP دوباره چک می‌شود
      # تنظیم‌های ثابت اجرای CI: تک‌تک (بدون همزمانی) و با فاصله، چون IP اینجا
      # دیتاسنتر است و عجله دقیقاً همان چیزی است که `?error=BAD_REQUEST` می‌سازد.
      GSA_CONCURRENCY: '1'
      GSA_DELAY_SEC: '25'
      GSA_FRESH_PROFILE: '0'
      GSA_OTP_TIMEOUT_SEC: '240'
      GSA_TIMEOUT_MIN: '300'
      GSA_CLAIM_BY: 'gha-${{ github.run_id }}'

    steps:
      - name: دریافت کد اتوماسیون (مخزن خصوصی GmailDuck)
        uses: actions/checkout@v5
        with:
          repository: daschera1492/GmailDuck
          ref: main
          path: GmailDuck
          token: ${{ secrets.GMAILDUCK_PAT }}

      - name: دریافت مخزن این ورک‌فلو (برای ثبت نتیجه)
        uses: actions/checkout@v5
        with:
          path: hichvaght

      - name: Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: GmailDuck/package-lock.json

      # ① بدون پروکسی هیچ‌چیز شروع نمی‌شود.
      - name: ① بررسی وجود پروکسی
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GSA_PROXY)) {
            Write-Error "پروکسی تنظیم نشده — نه ورودی proxy مقداری دارد نه Secret پروکسی. اجرا بدون پروکسی فقط BAD_REQUEST می‌دهد."
            exit 2
          }
          # فقط آدرس سرور؛ رمز هرگز در لاگ نمی‌آید.
          $server = (($env:GSA_PROXY -replace '^[a-z]+://', '') -split ':')[0..1] -join ':'
          Write-Host "proxy = $server (country=$env:GSA_PROXY_COUNTRY)"

      # ②③ زبان و منطقهٔ زمانی دستگاه روی کشور پروکسی.
      #
      # ویندوز culture کاربر را فقط برای زبانی قبول می‌کند که «زبان»ش در آن
      # نصب شده باشد — برای همین en-CA (خانوادهٔ انگلیسی که از قبل هست) بی‌درنگ
      # ست می‌شود ولی ja-JP نه، حتی وقتی Set-Culture خطا نمی‌دهد. پس اول بستهٔ
      # زبان را نصب می‌کنیم، بعد culture را می‌نویسیم، و اگر باز هم ویندوز
      # نپذیرفت مقدار را مستقیم در رجیستری کاربر می‌گذاریم.
      #
      # چیزی که گوگل می‌بیند اما زبانِ «مرورگر» است، نه زبان ویندوز؛ آن یکی
      # مستقل از ویندوز با --lang و Emulation.setLocaleOverride ست می‌شود و
      # در preflight با خواندن navigator.language و Intl اثبات می‌شود. پس
      # سخت‌گیریِ اصلی همان‌جاست (قدم پیش‌بررسی)؛ اینجا فقط گزارش می‌کنیم تا
      # یک رانر بدون بستهٔ زبان، اجرای درست را بی‌دلیل نسوزاند.
      - name: ②③ هم‌ترازی زبان و منطقهٔ زمانی ویندوز با کشور پروکسی
        run: |
          $geoJson = node -e "const g=require('./src/geo.js');process.stdout.write(JSON.stringify(g.geoProfile(process.argv[1])));" "$env:GSA_PROXY_COUNTRY"
          if ([string]::IsNullOrWhiteSpace($geoJson)) { throw 'پروفایل جغرافیایی خوانده نشد.' }
          $g = $geoJson | ConvertFrom-Json
          if (-not $g.known) { throw "کشور «$($g.country)» در جدول زبان/منطقهٔ زمانی نیست — هم‌ترازی ممکن نیست." }

          Write-Host "هدف: $($g.region) | زبان $($g.locale) | تایم‌زون $($g.timezone) ($($g.windowsTimezone))"

          # ③ منطقهٔ زمانی. TZ را حتی اگر Set-TimeZone ایراد بگیرد می‌نویسیم؛
          # Node آن را می‌خواند و مرورگر هم با emulateTimezone اجبار می‌شود.
          try {
            Set-TimeZone -Id $g.windowsTimezone -ErrorAction Stop
          } catch {
            Write-Warning "Set-TimeZone: $($_.Exception.Message)"
          }
          "TZ=$($g.timezone)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          # ② اگر بستهٔ زبان نیست، نصبش کن تا culture قابل تغییر شود.
          $culture = (Get-Culture).Name
          $freshCulture = {
            (pwsh -NoProfile -Command '(Get-Culture).Name' | Out-String).Trim()
          }
          if ($culture -ne $g.locale) { $culture = & $freshCulture }

          if ($culture -ne $g.locale -and (Get-Command Install-Language -ErrorAction SilentlyContinue)) {
            Write-Host "بستهٔ زبان $($g.locale) نصب نیست — نصب می‌شود (ممکن است چند دقیقه طول بکشد)..."
            try { Install-Language -Language $g.locale -ErrorAction Stop } catch { Write-Warning "Install-Language: $($_.Exception.Message)" }
          }

          try { Set-WinUserLanguageList -LanguageList $g.locale -Force -ErrorAction Stop } catch { Write-Warning "Set-WinUserLanguageList: $($_.Exception.Message)" }
          try { Set-Culture -CultureInfo $g.locale -ErrorAction Stop } catch { Write-Warning "Set-Culture: $($_.Exception.Message)" }
          try { Set-WinSystemLocale -SystemLocale $g.locale -ErrorAction Stop } catch { Write-Warning "Set-WinSystemLocale: $($_.Exception.Message)" }
          try { Set-WinUILanguageOverride -Language $g.locale -ErrorAction Stop } catch { Write-Warning "Set-WinUILanguageOverride: $($_.Exception.Message)" }
          try { Set-WinHomeLocation -GeoId $g.windowsGeoId -ErrorAction Stop } catch { Write-Warning "Set-WinHomeLocation: $($_.Exception.Message)" }

          # اگر Set-Culture هنوز اثر نکرد، مقدار کاربر را مستقیم می‌نویسیم؛
          # پروسه‌های تازه (و کرومی که بعداً بالا می‌آید) همین را می‌خوانند.
          $culture = & $freshCulture
          if ($culture -ne $g.locale) {
            try {
              $lcid = ([System.Globalization.CultureInfo]::new($g.locale)).LCID
              Set-ItemProperty 'HKCU:\Control Panel\International' -Name LocaleName -Value $g.locale -ErrorAction Stop
              Set-ItemProperty 'HKCU:\Control Panel\International' -Name Locale -Value ('{0:x8}' -f $lcid) -ErrorAction Stop
              Write-Host "LocaleName در رجیستری کاربر نوشته شد ($($g.locale), LCID $('{0:x8}' -f $lcid))."
            } catch {
              Write-Warning "نوشتن LocaleName در رجیستری: $($_.Exception.Message)"
            }
            try { Set-Culture -CultureInfo $g.locale -ErrorAction Stop } catch { Write-Warning "Set-Culture (تلاش دوم): $($_.Exception.Message)" }
            $culture = & $freshCulture
          }

          $tzId = (Get-TimeZone).Id
          $tzOk = $tzId -eq $g.windowsTimezone
          $cultureOk = $culture -eq $g.locale
          Write-Host "ویندوز الان: language=$culture timezone=$tzId | target language=$($g.locale) timezone=$($g.windowsTimezone)"

          if (-not $tzOk) {
            Write-Warning "منطقهٔ زمانی ویندوز $tzId ماند، نه $($g.windowsTimezone) — کروم مستقل روی $($g.timezone) اجبار می‌شود و preflight همان را اثبات می‌کند."
          }
          if (-not $cultureOk) {
            Write-Warning "زبان ویندوز $culture ماند، نه $($g.locale) — این رانر بستهٔ زبان را نپذیرفت. زبان کروم مستقل روی $($g.locale) اجبار می‌شود و preflight همان را اثبات می‌کند؛ برای گوگل همین معیار است."
          }

          $note = if ($cultureOk -and $tzOk) {
            '✅ ویندوز و مرورگر هر دو روی کشور پروکسی'
          } else {
            '⚠️ ویندوز کامل ست نشد؛ زبان/تایم‌زونِ مرورگر جداگانه اجبار و در preflight اثبات می‌شود'
          }

          @(
            '### ②③ هم‌ترازی دستگاه با کشور پروکسی'
            ''
            '| مورد | هدف | مقدار واقعی |'
            '| --- | --- | --- |'
            "| کشور | $($g.region) | — |"
            "| زبان ویندوز | $($g.locale) | $culture |"
            "| منطقهٔ زمانی ویندوز | $($g.windowsTimezone) | $tzId |"
            "| زبان کروم (اجباری) | $($g.locale) | $($g.acceptLanguage) |"
            "| منطقهٔ زمانی کروم (اجباری) | $($g.timezone) | — |"
            ''
            $note
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      # ④ اثبات با پرسیدن از خودِ اینترنت: این IP واقعاً مال آن کشور است؟
      # اگر نه، کار همین‌جا تمام می‌شود؛ هیچ آدرسی claim نمی‌شود.
      - name: ④ تأیید کشور واقعی IP پروکسی
        run: node scripts/verify-geo.js --country "$env:GSA_PROXY_COUNTRY" --require-proxy

      - name: نصب وابستگی‌ها
        run: npm ci --omit=dev --no-audit --no-fund

      # همان بررسی ①–④، این بار از داخل خودِ Chrome و روی همان session چسبنده‌ای
      # که ثبت‌نام با آن انجام می‌شود (زبان/تایم‌زون مرورگر هم اینجا سنجیده می‌شود).
      - name: بررسی پیش از اجرا (هاب + Chrome + زبان/تایم‌زون/کشور IP)
        run: node scripts/run-batch.js --preflight --count "$env:GSA_COUNT" --method "$env:GSA_METHOD" --require-proxy

      - name: ساخت حساب‌ها
        run: node scripts/run-batch.js

      - name: آپلود نتیجه‌ها
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signup-results-${{ github.run_id }}
          path: |
            GmailDuck/result.txt
            GmailDuck/used-addresses.txt
            GmailDuck/preflight.png
          if-no-files-found: ignore
          retention-days: 30

      # حافظهٔ قابل مرور: هر اجرا یک فایل در results/ تا بدون باز کردن لاگ هم
      # معلوم باشد کدام آدرس‌ها ساخته شدند. شکست این قدم شغل را خراب نمی‌کند.
      - name: ثبت نتیجه در مخزن
        if: always()
        working-directory: hichvaght
        continue-on-error: true
        run: |
          $stamp = (Get-Date).ToString('yyyy-MM-dd-HHmm')
          $src   = Join-Path $env:GITHUB_WORKSPACE 'GmailDuck\result.txt'
          New-Item -ItemType Directory -Force -Path results | Out-Null
          $out = "results/$stamp-run${{ github.run_id }}.txt"
          if (Test-Path $src) {
            Copy-Item $src $out -Force
          } else {
            Set-Content -Path $out -Value "no result.txt in this run"
          }
          git config user.name  "signup-batch"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase origin "${env:GITHUB_REF_NAME}" 2>$null
          git add $out
          if (git diff --cached --quiet) {
            Write-Host "نتیجه‌ای برای ثبت نبود."
          } else {
            git commit -m "batch: ${{ github.run_id }} (${env:GSA_COUNT} requested, method=${env:GSA_METHOD})"
            git push
          }
