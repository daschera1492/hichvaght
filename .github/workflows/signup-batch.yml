name: ساخت حساب  —  Signup batch

# اجرای کاملاً خودکارِ اتوماسیون ثبت‌نام گوگل (GmailDuck) روی رانر عمومی ویندوز
# گیت‌هاب — بدون هیچ دخالت دستی: claim از هاب ← ثبت‌نام ← کد از صندوق هاب ←
# گزارش registered/released ← پایان و بستن خودکار job.
#
# ورودی‌ها در لحظهٔ Start workflow (Run workflow) تعیین می‌شوند:
#   1. count         تعداد حساب برای ساخت
#   2. email_method  منبع ایمیل — «multiple» یعنی چند تیک بزنید؛ مقدار به‌صورت
#                    کاما-جدول می‌آید (duck,erine) و چرخشی فقط بین همان‌هاست:
#                    ۱ تیک = منبع ثابت · ۲–۳ تیک = چرخشی بین انتخاب‌شده‌ها
#   3. auto          full = کاملاً اتوماتیک (پیش‌فرض)
#   4. proxy         رشتهٔ پروکسی host:port:user:pass (برای نوع scrapeops خالی بگذار)
#   5. proxy_country کشور خروج پروکسی (پیش‌فرض us)
#   6. proxy_type    auto | rainproxy | scrapeops | oxylabs  — کدام نوع پروکسی
#   7. use_proxy     on = پروکسی روشن، off = هیچ پروکسی‌ای در کار نیست
#   8. concurrency   ۱..۶ ثبت‌نام همزمان (پیش‌فرض ۱) — هر کدام IP خودش را دارد
#
# ── سه نوع پروکسی (ورودی ۶) و سکرت هر کدام ────────────────────────────────────
#   نوع اول  rainproxy   host:port:user:pass با پسوند session روی نام کاربری
#                        (خط‌تیره‌ای):  user-country-us-session-<id>-sessTime-60
#                        → از Secret «PROXY» خوانده می‌شود.
#   نوع دوم  scrapeops   نام کاربری لیستِ پارامتر با «نقطه» و رمز = API key:
#                        scrapeops.country=us.sticky_session=<n>.session_timeout=60
#                        → از Secret «PROXY_SCRAPEOPS» خوانده می‌شود و کشورش را
#                          همین ورودی ۵ تعیین می‌کند (پس سکرت را بدون country بنویس).
#   نوع سوم  oxylabs     نام کاربری دش‌دار: customer-…-cc-JP-sessid-<n>-sesstime-60
#                        رمز = پسورد دشبورد (حاوی +، در URL نگذارش)
#                        → از Secret «PROXY_OXYLABS» خوانده می‌شود:
#                          pr.oxylabs.io:7777:customer-resi_<ID>:<PASSWORD>
#                        کشور را همین ورودی ۵ تعیین می‌کند (پس سکرت را بدون cc- بنویس).
#   auto (پیش‌فرض)       از روی آدرس خودِ سکرت تشخیص می‌دهد: scrapeops.io → نوع دوم،
#                        oxylabs.io → نوع سوم، بقیه → نوع اول.
#
#   هر سه نوع «رزیدنتیال» هستند (IPهای مسکونی واقعی، نه دیتاسنتر) و دروازهٔ
#   روشن/خاموش (ورودی ۷) برای هر سه یکسان کار می‌کند چون دروازه فقط یک
#   HTTP-CONNECT relay است.
#
# ── کلید پروکسی (use_proxy) و رفتارش ─────────────────────────────────────────
#   off → GSA_USE_PROXY=0 یعنی هیچ‌جا پروکسی در کار نیست: نه Chrome با آن
#         راه می‌افتد، نه چک کشور IP، نه هم‌ترازی زبان/تایم‌زون (قدم‌های
#         ①–④ همین‌جا skip می‌شوند). فقط وقتی باید برود off که می‌دانی
#         اجرای بدون پروکسی جواب می‌دهد.
#   on  → پروکسی روشن است، ولی «همیشه» روشن نیست: کروم به جای پروکسیِ اصلی
#         به یک دروازهٔ محلی وصل می‌شود و آن دروازه فقط «موقع» ورود به
#         https://accounts.cloud.google.com/signup/email باز می‌شود و با
#         بستن پنجرهٔ همان آدرس — موفق یا ناموفق — دوباره بسته می‌شود.
#         هر آدرس یک چرخهٔ جدا دارد: ۸ تا ثبت‌نام یعنی ۸ بار روشن/خاموش،
#         و هیچ ترافیکی بینشان از پروکسی رد نمی‌شود (مصرف الکی حذف شد).
#
# ── چرا پروکسی به‌تنهایی بی‌فایده بود ──────────────────────────────────────────
# یک IP مسکونی وقتی «کامپیوتر» هنوز en-US و America/Los_Angeles است، خودش
# تناقض است: گوگل کشور IP را با زبان مرورگر و منطقهٔ زمانی دستگاه مقایسه
# می‌کند و تناقض = همان امتیاز ریسکی که آخرِ ثبت‌نام `?error=BAD_REQUEST`
# می‌دهد. پس ترتیب اجرا این است و هر مرحله سخت‌گیرانه است:
#
#   ① پروکسی الزامی است — بدون آن اجرا اصلاً شروع نمی‌شود.
#   ② زبان کروم دقیقاً روی کشور پروکسی ست می‌شود (و زبان ویندوز هم تا جای
#      ممکن؛ اگر رانر بستهٔ زبان را نداشته باشد، فقط هشدار می‌دهد چون معیار
#      واقعیِ گوگل زبانِ مرورگر است).
#   ③ منطقهٔ زمانی کروم دقیقاً روی همان کشور ست می‌شود (و ویندوز هم همین‌طور).
#   ④ سپس IP واقعیِ خروجی از دو سرویس مستقل پرسیده می‌شود؛ اگر کشورش با
#      کشور مورد انتظار یکی نبود، کار همان‌جا با شکست تمام می‌شود.
#
# Secret های لازم (Settings → Secrets and variables → Actions):
#   HUB_URL           آدرس هاب          (قبلاً هم ثبت شده)
#   HUB_API_KEY       کلید dhk_… هاب     (قبلاً هم ثبت شده)
#   PROXY             سکرت نوع اول:     host:port:user:pass
#   PROXY_SCRAPEOPS   سکرت نوع دوم:     residential-proxy.scrapeops.io:8181:scrapeops:<API_KEY>
#   PROXY_OXYLABS     سکرت نوع سوم:     pr.oxylabs.io:7777:customer-resi_<ID>:<PASSWORD>
#   GMAILDUCK_PAT     توکن دسترسی به مخزن خصوصی daschera1492/GmailDuck

on:
  workflow_dispatch:
    inputs:
      count:
        description: '۱) تعداد حساب برای ساخت'
        required: true
        default: '1'
      email_method:
        description: '۲) منبع ایمیل — چند تیک بزن = چرخشی بین همان‌ها؛ یک تیک = منبع ثابت؛ هر سه = rotate'
        required: true
        default: 'duck'
        type: multiple
        options:
          - duck
          - generated
          - erine
      auto:
        description: '۳) حالت اجرا — full کاملاً اتوماتیک است (تیک و دکمهٔ آخر را هم ماشین می‌زند)'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - manual
      proxy:
        description: '۴) رشتهٔ پروکسی (host:port:user:pass) — برای نوع scrapeops خالی بگذار (از Secret PROXY_SCRAPEOPS خوانده می‌شود)'
        required: false
        default: ''
      proxy_country:
        description: '۵) کشور خروج پروکسی — زبان و منطقهٔ زمانی دستگاه هم روی همین کشور ست می‌شود'
        required: true
        default: 'us'
        type: choice
        options:
          - us
          - ca
          - gb
          - de
          - fr
          - nl
          - es
          - it
          - se
          - pl
          - tr
          - ae
          - au
          - jp
          - kr
          - in
          - br
          - mx
      proxy_type:
        description: '۶) نوع پروکسی — نوع اول (rainproxy) یا نوع دوم (scrapeops)؛ auto یعنی از روی آدرس تشخیص بده'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - rainproxy
          - scrapeops
          - oxylabs
      use_proxy:
        description: '۷) کلید پروکسی — on = فقط موقع ثبت‌نام روشن می‌شود، off = هیچ پروکسی‌ای در کار نیست'
        required: true
        default: 'on'
        type: choice
        options:
          - on
          - off
      concurrency:
        description: '۸) همزمانی — چند ثبت‌نام همزمان روی رانر (عدد ۱ تا ۱۰، پیش‌فرض ۱). هر ثبت‌نام IP خودش را دارد'
        required: true
        default: '1'

# همزمانی بین دسته‌ها: قبلاً سریال بود (یک دسته پشت سر دیگری) تا از الگوی
# ریسک جلوگیری شود. حالا هر ثبت‌نام IP خودش را دارد، پس دسته‌ها می‌توانند
# همزمان اجرا شوند. هر دسته نتیجهٔ خودش را با git pull --rebase ثبت می‌کند.

permissions:
  contents: write # ثبت نتیجهٔ هر اجرا در پوشهٔ results/

jobs:
  batch:
    runs-on: windows-latest
    timeout-minutes: 340 # زیر سقف ۶ ساعتهٔ job ها؛ خودِ اسکریپت سقف ۳۰۰ دقیقه دارد.
    defaults:
      run:
        shell: pwsh
        working-directory: GmailDuck

    env:
      HUB_URL: ${{ vars.HUB_URL || secrets.HUB_URL }}
      HUB_KEY: ${{ vars.HUB_KEY || secrets.HUB_API_KEY }}
      # ۱) تعداد
      GSA_COUNT: ${{ inputs.count }}
      # ۲) منبع ایمیل
      GSA_METHOD: ${{ inputs.email_method }}
      # ۳) کاملاً اتوماتیک
      GSA_AUTO_FINISH: ${{ inputs.auto == 'full' && '1' || '0' }}
      # ۷) کلید اصلی: off → هیچ پروکسی‌ای در کل اجرا نیست (off در proxy.js
      #    از ریشه خاموشش می‌کند؛ Chrome، چک کشور IP و هم‌ترازی زبان همه
      #    با همین یک مقدار تصمیم می‌گیرند).
      GSA_USE_PROXY: ${{ inputs.use_proxy == 'off' && '0' || '1' }}
      # ۶) نوع پروکسی — auto دیالکت را از روی آدرس خودِ سکرت تشخیص می‌دهد
      #    (میزبان scrapeops.io → نوع دوم، بقیه → نوع اول).
      GSA_PROXY_TYPE: ${{ inputs.proxy_type }}
      # ۴) پروکسی — کدام سکرت؟
      #      ورودی ۴ مقدار داشته باشد → همان (تست دستی)
      #      نوع scrapeops       → Secret PROXY_SCRAPEOPS (نوع دوم)
      #      نوع oxylabs         → Secret PROXY_OXYLABS  (نوع سوم)
      #      بقیه (auto/rainproxy) → Secret PROXY          (نوع اول)
      #    خالی بودن همه یعنی `npm` هم شروع نمی‌شود.
      GSA_PROXY: ${{ inputs.proxy != '' && inputs.proxy || inputs.proxy_type == 'scrapeops' && secrets.PROXY_SCRAPEOPS || inputs.proxy_type == 'oxylabs' && secrets.PROXY_OXYLABS || secrets.PROXY }}
      GSA_PROXY_COUNTRY: ${{ inputs.proxy_country }}
      GSA_PROXY_STICKY: '1'   # یک IP ثابت برای کل یک ثبت‌نام
      GSA_PROXY_STRICT: '1'    # بدون تعویض بی‌خبر IP در وسط ثبت‌نام
      GSA_PROXY_SESSION_MIN: '60'
      # ① پروکسی اجباری است و ④ اگر کشور IP تأیید نشد، اجرا ادامه پیدا نمی‌کند —
      # مگر اینکه خودِ کلید پروکسی خاموش باشد.
      GSA_REQUIRE_PROXY: ${{ inputs.use_proxy == 'off' && '0' || '1' }}
      GSA_GEO_STRICT: '1'
      GSA_GEO_CHECK_EACH: '1'  # پیش از هر ثبت‌نام هم کشور IP دوباره چک می‌شود
      # همزمانی: از ورودی ۸. هر ثبت‌نام IP خودش را دارد (sticky session جدا)؛
      # عجلهٔ بیش از حد (delay کم + همزمانی بالا) همان چیزی است که
      # `?error=BAD_REQUEST` می‌سازد، پس delay 25 ثانیه ثابت می‌ماند.
      GSA_CONCURRENCY: ${{ inputs.concurrency }}
      GSA_DELAY_SEC: '25'
      GSA_FRESH_PROFILE: '0'
      GSA_OTP_TIMEOUT_SEC: '240'
      GSA_TIMEOUT_MIN: '300'
      GSA_CLAIM_BY: 'gha-${{ github.run_id }}'

    steps:
      - name: دریافت کد اتوماسیون (مخزن خصوصی GmailDuck)
        uses: actions/checkout@v5
        with:
          repository: daschera1492/GmailDuck
          ref: main
          path: GmailDuck
          token: ${{ secrets.GMAILDUCK_PAT }}

      - name: دریافت مخزن این ورک‌فلو (برای ثبت نتیجه)
        uses: actions/checkout@v5
        with:
          path: hichvaght

      - name: Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: GmailDuck/package-lock.json

      # ⓪ کلید off — فقط یک یادداشت؛ هیچ‌کدام از قدم‌های پروکسی اجرا نمی‌شوند.
      - name: ⓪ اعلام پروکسی خاموش
        if: env.GSA_USE_PROXY == '0'
        run: Write-Host "GSA_USE_PROXY=0 — هیچ پروکسی‌ای در کار نیست؛ کل ترافیک با IP همین رانر می‌رود."

      # ① بدون پروکسی هیچ‌چیز شروع نمی‌شود — و سکرتِ درست باید پر شده باشد.
      - name: ① بررسی وجود پروکسی
        if: env.GSA_USE_PROXY == '1'
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GSA_PROXY)) {
            if ($env:GSA_PROXY_TYPE -eq 'scrapeops') {
              Write-Error "نوع پروکسی scrapeops است ولی Secret «PROXY_SCRAPEOPS» خالی است. مقدار آن باید این شکلی باشد: residential-proxy.scrapeops.io:8181:scrapeops:<API_KEY>"
            } elseif ($env:GSA_PROXY_TYPE -eq 'oxylabs') {
              Write-Error "نوع پروکسی oxylabs است ولی Secret «PROXY_OXYLABS» خالی است. مقدار آن باید این شکلی باشد: pr.oxylabs.io:7777:customer-resi_<ID>:<PASSWORD>"
            } else {
              Write-Error "پروکسی تنظیم نشده — نه ورودی proxy مقداری دارد نه Secret «PROXY». اجرا بدون پروکسی فقط BAD_REQUEST می‌دهد."
            }
            exit 2
          }
          # نوع دوم/سوم انتخاب شده ولی سکرتِ نوع اول برگشته → سکرت ساخته نشده.
          if ($env:GSA_PROXY_TYPE -eq 'scrapeops' -and $env:GSA_PROXY -notmatch 'scrapeops') {
            Write-Error "نوع scrapeops انتخاب شده ولی Secret «PROXY_SCRAPEOPS» خالی است و مقدار از Secret «PROXY» آمده. سکرت نوع دوم را بساز."
            exit 2
          }
          if ($env:GSA_PROXY_TYPE -eq 'oxylabs' -and $env:GSA_PROXY -notmatch 'oxylabs') {
            Write-Error "نوع oxylabs انتخاب شده ولی Secret «PROXY_OXYLABS» خالی است و مقدار از Secret «PROXY» آمده. سکرت نوع سوم را بساز."
            exit 2
          }
          # فقط آدرس سرور؛ رمز/API-key هرگز در لاگ نمی‌آید.
          $server = (($env:GSA_PROXY -replace '^[a-z]+://', '') -split ':')[0..1] -join ':'
          Write-Host "proxy = $server | type = $env:GSA_PROXY_TYPE | country = $env:GSA_PROXY_COUNTRY"

      # ②③ زبان و منطقهٔ زمانی دستگاه روی کشور پروکسی — جزئیات و همهٔ
      # تلاش‌های جایگزین در GmailDuck/scripts/align-os-geo.ps1 است. خلاصه:
      # Set-Culture برای زبانی که بستهٔ زبانش نصب نیست بی‌صدا بی‌اثر است
      # (en-CA ست می‌شد، ja-JP نه)، پس اگر اثر نکرد مقدار کاربر مستقیم در
      # رجیستری نوشته می‌شود. زبانِ مرورگر هم مستقل اجبار می‌شود و preflight
      # آن را اثبات می‌کند؛ اگر آنجا فرق داشت اجرا ادامه پیدا نمی‌کند.
      - name: ②③ هم‌ترازی زبان و منطقهٔ زمانی ویندوز با کشور پروکسی
        if: env.GSA_USE_PROXY == '1'
        run: pwsh -NoProfile -File scripts/align-os-geo.ps1 -Country "$env:GSA_PROXY_COUNTRY"

      # ④ اثبات با پرسیدن از خودِ اینترنت: این IP واقعاً مال آن کشور است؟
      # اگر نه، کار همین‌جا تمام می‌شود؛ هیچ آدرسی claim نمی‌شود.
      - name: ④ تأیید کشور واقعی IP پروکسی
        if: env.GSA_USE_PROXY == '1'
        run: node scripts/verify-geo.js --country "$env:GSA_PROXY_COUNTRY" --require-proxy

      - name: نصب وابستگی‌ها
        run: npm ci --omit=dev --no-audit --no-fund

      # همان بررسی ①–④، این بار از داخل خودِ Chrome و روی همان session چسبنده‌ای
      # که ثبت‌نام با آن انجام می‌شود (زبان/تایم‌زون مرورگر هم اینجا سنجیده می‌شود).
      - name: بررسی پیش از اجرا (هاب + Chrome + زبان/تایم‌زون/کشور IP)
        run: node scripts/run-batch.js --preflight --count "$env:GSA_COUNT" --method "$env:GSA_METHOD" --require-proxy

      - name: ساخت حساب‌ها
        run: node scripts/run-batch.js

      - name: آپلود نتیجه‌ها
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signup-results-${{ github.run_id }}
          path: |
            GmailDuck/result.txt
            GmailDuck/used-addresses.txt
            GmailDuck/preflight.png
          if-no-files-found: ignore
          retention-days: 30

      # حافظهٔ قابل مرور: هر اجرا یک فایل در results/ تا بدون باز کردن لاگ هم
      # معلوم باشد کدام آدرس‌ها ساخته شدند. شکست این قدم شغل را خراب نمی‌کند.
      - name: ثبت نتیجه در مخزن
        if: always()
        working-directory: hichvaght
        continue-on-error: true
        run: |
          $stamp = (Get-Date).ToString('yyyy-MM-dd-HHmm')
          $src   = Join-Path $env:GITHUB_WORKSPACE 'GmailDuck\result.txt'
          New-Item -ItemType Directory -Force -Path results | Out-Null
          $out = "results/$stamp-run${{ github.run_id }}.txt"
          if (Test-Path $src) {
            Copy-Item $src $out -Force
          } else {
            Set-Content -Path $out -Value "no result.txt in this run"
          }
          git config user.name  "signup-batch"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase origin "${env:GITHUB_REF_NAME}" 2>$null
          git add $out
          if (git diff --cached --quiet) {
            Write-Host "نتیجه‌ای برای ثبت نبود."
          } else {
            git commit -m "batch: ${{ github.run_id }} (${env:GSA_COUNT} requested, method=${env:GSA_METHOD})"
            git push
          }
