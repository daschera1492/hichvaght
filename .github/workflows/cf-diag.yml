name: CF tunnel probe (temporary)

# Throwaway probe: the tunnel now exists, so this checks whether the existing
# token can read its connector token and rewrite its ingress. If both work, the
# workflow never needs a CF_TUNNEL_TOKEN secret at all.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}

    steps:
      - name: Probe the existing tunnel
        run: |
          node --input-type=module -e '
          const tok = process.env.CF_API_TOKEN;
          const account = "8c2856c1802507782f8ab06c557bcf74";
          const tunnel = "7e6c3a94-4896-4e51-932f-da968bb7f536";
          const call = async (method, path, body) => {
            const res = await fetch(`https://api.cloudflare.com/client/v4${path}`, {
              method,
              headers: { Authorization: `Bearer ${tok}`, "Content-Type": "application/json" },
              body: body ? JSON.stringify(body) : undefined,
            });
            let json;
            try { json = await res.json(); } catch { json = { parse: "failed" }; }
            return { status: res.status, json };
          };
          const show = (label, r, extra = "") => {
            const j = r.json || {};
            const errs = (j.errors || []).map((e) => `${e.code}:${e.message}`).join(" | ") || "-";
            console.log(`${label.padEnd(34)} http=${r.status} success=${j.success} ${extra}`);
            if (errs !== "-") console.log(`    errors: ${errs}`);
          };

          const list = await call("GET", `/accounts/${account}/cfd_tunnel?is_deleted=false`);
          show("GET  list tunnels", list, `result[${list.json?.result?.length ?? 0}]`);
          for (const t of list.json?.result || []) {
            console.log(`    ${t.id}  name=${t.name}  status=${t.status}  conns=${(t.connections||[]).length}`);
          }

          const one = await call("GET", `/accounts/${account}/cfd_tunnel/${tunnel}`);
          show("GET  tunnel by id", one, one.json?.result?.name ?? "");

          const tokRes = await call("GET", `/accounts/${account}/cfd_tunnel/${tunnel}/token`);
          const value = typeof tokRes.json?.result === "string" ? tokRes.json.result : "";
          show("GET  tunnel token", tokRes, value ? `len=${value.length} prefix=${value.slice(0, 6)}` : "no token");

          const cfg = await call("GET", `/accounts/${account}/cfd_tunnel/${tunnel}/configurations`);
          show("GET  configurations", cfg);
          console.log(`    ingress: ${JSON.stringify(cfg.json?.result?.config?.ingress ?? null)}`);

          if (cfg.json?.success) {
            const put = await call("PUT", `/accounts/${account}/cfd_tunnel/${tunnel}/configurations`, {
              config: {
                ingress: [
                  { hostname: "router2.codol.ir", service: "http://localhost:20128" },
                  { service: "http_status:404" },
                ],
              },
            });
            show("PUT  configurations", put);
          }
          '
