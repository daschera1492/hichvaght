name: Duck collector → DuckMail Hub

# جمع‌آوری آدرس‌های duck.com با راند‌روبین بین توکن‌های داک‌داک‌گو
# و ثبت هر آدرس تازه در وردپرس DuckMail Hub.
#
# تنظیمات لازم (Settings → Secrets and variables → Actions → Variables):
#   HUB_URL      ← مثلا https://your-site.example.com  (ریشه سایت وردپرس)
#   HUB_API_KEY  ← کلید هاب (dhk_…) با مجوز pool
#   DDG_TOKENS   ← (اختیاری) استخر پیش‌فرض توکن‌ها، هر خط یکی
#
# گروکری: برای کلید و توکن‌ها می‌توانید به‌جای Variables از Secrets هم استفاده
# کنید — همین ورک‌فلو هر دو را می‌بیند.

on:
  workflow_dispatch:
    inputs:
      interval_seconds:
        description: 'فاصله (ثانیه) بین هر دریافت ایمیل داک'
        required: false
        default: '45'
      duck_tokens:
        description: 'توکن‌های داک‌داک‌گو — هر خط یکی (اگر مولتی‌لاین نشد با کاما جدا کن). خالی = variable DDG_TOKENS'
        required: false
        default: ''
      max_addresses:
        description: 'حداکثر آدرس موفق در این اجرا (0 = تا وقتی توکن‌ها می‌کشند ادامه بده)'
        required: false
        default: '0'

permissions:
  contents: write # برای کامیت کردن used-addresses.txt در پایان

concurrency:
  group: duck-collector
  cancel-in-progress: false # دو کلکتور همزمان توکن‌ها را نمی‌کُشند

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 330 # سقف گیتهاب برای یک جاب
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Collect addresses (round-robin) → Hub
        env:
          HUB_URL: ${{ vars.HUB_URL }}
          HUB_KEY: ${{ vars.HUB_API_KEY || secrets.HUB_API_KEY }}
          DUCK_TOKENS: ${{ inputs.duck_tokens || vars.DDG_TOKENS || secrets.DDG_TOKENS }}
          INTERVAL_SECONDS: ${{ inputs.interval_seconds }}
          MAX_ADDRESSES: ${{ inputs.max_addresses }}
          USED_FILE: ${{ github.workspace }}/used-addresses.txt
        run: node scripts/collect-to-hub.js

      - name: Commit used-addresses.txt (حافظه تکراری برای اجرای بعدی)
        env:
          TOKEN_FILE: used-addresses.txt
        run: |
          git config user.name  "duck-collector"
          git config user.email "actions@users.noreply.github.com"
          git add "$TOKEN_FILE"
          if git diff --cached --quiet; then
            echo "تغییری نبود."
          else
            git commit -m "collector: record $(git diff --cached --numstat | awk '{print $1}') new duck address(es)"
            git push
          fi
