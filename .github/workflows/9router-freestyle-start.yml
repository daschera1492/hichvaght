name: 9Router Start

# Creates the 9Router VM on Freestyle, installs it, optionally restores the state
# archived by the last Stop, and routes the fixed hostname to it.
#
# with_backup ticked  -> restore the last archive (or the baseline seed on a
#                        brand-new setup)
# with_backup unticked -> "khām": a blank 9router, nothing loaded into it
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "حالت شروع: با بکاپ (کانفیگ قبلی) یا خام (هیچ بکاپی لود نمی‌شه)"
        type: choice
        default: with-backup
        options:
          - with-backup
          - fresh
      idle_timeout:
        description: "Seconds of inactivity before the VM auto-pauses"
        required: false
        default: "1200"

# Never let two lifecycle runs fight over the same VM.
concurrency:
  group: 9router-lifecycle
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  start:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      FREESTYLE_API_KEY: ${{ secrets.FREESTYLE_API_KEY }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
      ROUTER_DOMAIN: router.codol.ir
      ROUTER_SLUG: nine-router
      ROUTER_PORT: "20128"
      NINE_ROUTER_PASSWORD: ${{ secrets.NINE_ROUTER_PASSWORD }}
      IDLE_TIMEOUT_SECONDS: ${{ inputs.idle_timeout }}
      FREESTYLE_SNAPSHOT: freestyle/ubuntu-sm
      RESTORE_BACKUP: ${{ inputs.mode != 'fresh' }}
      GITHUB_TOKEN: ${{ github.token }}
      BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: scripts/freestyle-router
        run: npm install --no-audit --no-fund

      - name: Start 9Router
        working-directory: scripts/freestyle-router
        run: node start.mjs
