name: tmp-copy-cf-secrets

# Temporary, one-off: copy CF_API_TOKEN and CF_ZONE_ID into the Polygate loop
# repository as sealed secrets. Deleted right after it runs.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  copy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install libsodium
        run: npm install --no-save libsodium-wrappers

      - name: Copy the secrets
        env:
          SRC_CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          SRC_CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          TARGET_TOKEN: ${{ secrets.TARGET_GH_PAT }}
        run: node scripts/tmp/copy-secrets.mjs
