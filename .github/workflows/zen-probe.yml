name: zen-probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: egress
        run: |
          echo "--- egress ---"
          curl -s --max-time 20 https://www.cloudflare.com/cdn-cgi/trace | grep -E '^(ip|loc|warp)='
      - name: probe free lane
        run: |
          cat > /tmp/p.cjs <<'EOF'
          const c = require("crypto");
          const b62 = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz";
          const counter = 1 + Math.floor(Math.random() * 16);
          const prefix = (~(BigInt(Date.now()) * 4096n + BigInt(counter)) & 0xFFFFFFFFFFFFn).toString(16).padStart(12, "0");
          const r = c.randomBytes(14);
          let tail = "";
          for (let i = 0; i < 14; i++) tail += b62[r[i] % 62];
          const ses = "ses_" + prefix + tail;
          const env = "<env>\n  Working directory: /workspace\n  Workspace root folder: /workspace\n</env>";
          fetch("https://opencode.ai/zen/v1/chat/completions", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: "Bearer public",
              "User-Agent": "opencode/latest/2.0.26/cli",
              "x-opencode-client": "cli",
              "x-opencode-session": ses,
              "x-opencode-session-id": ses,
              "x-session-affinity": ses,
              "x-session-id": ses,
              "x-opencode-project": "global",
              Accept: "*/*",
            },
            body: JSON.stringify({
              model: "deepseek-v4.1-flash-free",
              messages: [{ role: "system", content: env }, { role: "user", content: "say hi" }],
              max_tokens: 16,
              stream: false,
            }),
          }).then(async (res) => {
            console.log("session=" + ses);
            console.log("http=" + res.status + " retry-after=" + (res.headers.get("retry-after") || "-"));
            console.log((await res.text()).slice(0, 400));
          }).catch((e) => console.log("ERR " + e.message));
          EOF
          node /tmp/p.cjs
